name: Pylint
on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/pylint.yml"
permissions:
  contents: read
concurrency:
  group: pylint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pylint:
    name: Pylint (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint distro
      - name: Analyse Python code
        run: |
          git ls-files -z "*.py" |
          xargs -0 --no-run-if-empty python -m pylint --max-line-length=100
